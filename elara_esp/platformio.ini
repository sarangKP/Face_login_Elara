[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
    bodmer/TFT_eSPI@^2.5.43

; Define display config directly so TFT_eSPI never needs User_Setup.h.
; Adjust the GPIO numbers below if your wiring differs.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER=1
    -DST7735_BLACKTAB=1
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=2
    -DTFT_RST=4
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
    -DDISABLE_ALL_LIBRARY_WARNINGS

monitor_speed = 115200
upload_speed  = 921600
